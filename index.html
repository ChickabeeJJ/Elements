<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e15">
  <meta name="description" content="Element Rag - a physics ragdoll brawler across seven elemental realms. Unlock 16 elements, knock foes off floating islands, beat 56 stages and bosses, then survive Endless.">
  <title>Element Rag</title>
  <link rel="stylesheet" href="css/style.css?v=34">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <canvas id="stage" aria-label="Game"></canvas>

  <!-- =============================== HUD =============================== -->
  <div id="hud" class="hidden">
    <div class="stage-chip" id="stageChip">
      <span class="chip-emblem" id="chipEmblem"></span>
      <div class="chip-body">
        <b id="chipTitle">VERDANT VALE 1-1</b>
        <div class="chip-sub"><span class="dots" id="waveDots"></span><span id="chipSub">3 FOES</span></div>
      </div>
    </div>
    <div class="bossbar hidden" id="bossBar">
      <div class="boss-top"><span class="chip-emblem" id="bossEmblem"></span><b id="bossName">BOSS</b></div>
      <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
      <small id="bossTitle"></small>
    </div>
    <div class="hud-right">
      <button class="round" id="btnPause" aria-label="Pause"><span class="ic" data-icon="pause"></span></button>
    </div>

    <div class="combo hidden" id="combo"><b id="comboNum">0</b><span>COMBO</span></div>
    <div class="banner hidden" id="banner"><span id="bannerText">WAVE 1</span></div>

    <div class="dock" id="dock"></div>
    <div class="skillbar" id="skillbar">
      <div class="skill" data-i="1"><span class="sk-icon"></span><b class="sk-name"></b><kbd class="sk-key">Q</kbd><span class="sk-cd"></span></div>
      <div class="skill" data-i="2"><span class="sk-icon"></span><b class="sk-name"></b><kbd class="sk-key">E</kbd><span class="sk-cd"></span></div>
    </div>
    <div class="abilities" id="abilities">
      <button class="orb orb-p1" data-act="p1"><span class="ring"></span><span class="orb-icon"></span><span class="cd-num"></span><kbd>Q</kbd></button>
      <button class="orb orb-p2" data-act="p2"><span class="ring"></span><span class="orb-icon"></span><span class="cd-num"></span><kbd>E</kbd></button>
      <button class="orb orb-main" data-act="attack"><span class="ring"></span><span class="orb-icon"></span><span class="cd-num"></span><kbd>CLICK</kbd></button>
      <button class="orb orb-jump" data-act="jump"><span class="orb-icon"><span class="ic" data-icon="up"></span></span></button>
    </div>
    <div class="joy" id="joy"><div class="joy-base"></div><div class="joy-knob" id="joyKnob"></div></div>
    <div class="coach hidden" id="coach"><p id="coachText"></p></div>
    <div class="tut hidden" id="tut">
      <div class="tut-dots" id="tutDots"></div>
      <div class="tut-vis" id="tutVis"></div>
      <div class="tut-label"><b id="tutText">MOVE</b><span id="tutCount"></span></div>
      <button class="tut-skip" id="tutSkip">SKIP<span class="ic" data-icon="next"></span></button>
    </div>
  </div>

  <!-- =============================== HOME =============================== -->
  <section id="home" class="screen">
    <div class="home-panel">
      <h1 class="title"><span class="t1">ELEMENT</span><span class="t2">RAG</span></h1>
      <div class="home-menu">
        <button class="btn primary big" id="btnPlay"><span class="ic" data-icon="play"></span><span class="bt"><b>PLAY</b><small id="playSub">STAGE 1-1</small></span></button>
        <button class="btn" id="btnEndless"><span class="ic" data-icon="infinity"></span><span class="bt"><b>ENDLESS</b><small id="endlessSub">BEST 0</small></span></button>
        <div class="btn-row">
          <button class="btn tile" data-open="stages"><span class="ic" data-icon="map"></span><b>STAGES</b></button>
          <button class="btn tile" data-open="codex"><span class="ic" data-icon="swirl"></span><b>ELEMENTS</b></button>
          <button class="btn tile" data-open="forge"><span class="ic" data-icon="hammer"></span><b>UPGRADES</b><i class="note hidden" id="homeForge"></i></button>
        </div>
      </div>
      <div class="loadout-card" id="homeLoadout"></div>
    </div>
    <div class="corner tr">
      <button class="pill user hidden" id="userChip"></button>
      <div class="pill stars"><span class="ic star" data-icon="star"></span><b id="homeStars">0</b></div>
      <div class="pill"><span class="ic gem" data-icon="gem"></span><b class="essence-val">0</b></div>
      <button class="round" data-open="settings" aria-label="Settings"><span class="ic" data-icon="gear"></span></button>
    </div>
  </section>

  <!-- =============================== MAP =============================== -->
  <section id="map" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <nav class="seg" id="realmTabs"></nav>
      <button class="btn small" data-open="loadout"><b>LOADOUT</b></button>
    </header>
    <div class="realm-head" id="realmHead"></div>
    <div class="stage-grid" id="stageGrid"></div>
  </section>

  <!-- ============================== CODEX ============================== -->
  <section id="codex" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <h2>ELEMENTS</h2>
      <div class="pill"><b id="codexCount">1/12</b></div>
    </header>
    <div class="codex">
      <div class="codex-list" id="codexList"></div>
      <div class="codex-detail card" id="codexDetail"></div>
    </div>
  </section>

  <!-- ============================== FORGE ============================== -->
  <section id="forge" class="screen hidden">
    <header class="bar">
      <button class="round" data-back aria-label="Back"><span class="ic" data-icon="back"></span></button>
      <h2>UPGRADES</h2>
      <div class="pill"><span class="ic gem" data-icon="gem"></span><b class="essence-val">0</b></div>
    </header>
    <div class="forge" id="forgeGrid"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toasts"></div>
  <div id="rotate" class="hidden"><div><span class="ic" data-icon="rotate"></span><p>TURN YOUR DEVICE SIDEWAYS</p><button class="btn primary" id="btnRotateOk"><b>PLAY ANYWAY</b></button></div></div>

  <script src="js/util.js?v=34"></script>
  <script src="js/platform.js?v=34"></script>
  <script src="js/audio.js?v=34"></script>
  <script src="js/elements.js?v=34"></script>
  <script src="js/realms.js?v=34"></script>
  <script src="js/progress.js?v=34"></script>
  <script src="js/ragdoll.js?v=34"></script>
  <script src="js/world.js?v=34"></script>
  <script src="js/fx.js?v=34"></script>
  <script src="js/game.js?v=34"></script>
  <script src="js/icons.js?v=34"></script>
  <script src="js/ui.js?v=34"></script>
  <script src="js/main.js?v=34"></script>
</body>
</html>
